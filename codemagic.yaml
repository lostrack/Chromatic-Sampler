workflows:
  chromatic-macos:
    name: Chromatic Sampler macOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        JUCE_VERSION: "9.0.4"
    scripts:
      - name: Get JUCE
        script: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git "$HOME/JUCE"
      - name: Configure
        script: cmake -S . -B build -G Xcode -DJUCE_DIR="$HOME/JUCE"
      - name: Build (AU, VST3, Standalone)
        script: cmake --build build --config Release
      - name: Ad-hoc sign
        script: |
          cd build/ChromaticSampler_artefacts/Release
          for b in "AU/Chromatic Sampler.component" "VST3/Chromatic Sampler.vst3" "Standalone/Chromatic Sampler.app"; do
            codesign --force --deep --sign - "$b"
          done
      - name: Make installer (.pkg) and disk image (.dmg)
        script: |
          set -e
          R="$CM_BUILD_DIR/build/ChromaticSampler_artefacts/Release"
          P="$HOME/pkgs"; mkdir -p "$P" dist
          mk() {
            mkdir -p "$P/root-$1"; cp -R "$2" "$P/root-$1/"
            pkgbuild --root "$P/root-$1" --install-location "$3" --identifier "com.selevenaudio.chromaticsampler.$1" --version 1.0.0 "$P/$1.pkg"
          }
          mk au         "$R/AU/Chromatic Sampler.component"    "/Library/Audio/Plug-Ins/Components"
          mk vst3       "$R/VST3/Chromatic Sampler.vst3"       "/Library/Audio/Plug-Ins/VST3"
          mk standalone "$R/Standalone/Chromatic Sampler.app"  "/Applications"
          cp installer-dist.xml "$P/dist.xml"
          productbuild --distribution "$P/dist.xml" --package-path "$P" "dist/Chromatic Sampler Installer.pkg"
          mkdir -p "$P/dmg"; cp "dist/Chromatic Sampler Installer.pkg" "$P/dmg/"
          hdiutil create -volname "Chromatic Sampler" -srcfolder "$P/dmg" -ov -format UDZO "dist/Chromatic-Sampler-1.0.0.dmg"
    artifacts:
      - dist/*
